[project]
name = "schemas"
version = "0.1.0"
description = "Shared Python schemas for A Step Forward services."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas"]
