[project]
name = "asf_qa_flow"
version = "0.1.0"
description = "A Step Forward multi-crew QA Flow (integration, UI, product QA, security, evals)"
authors = [{ name = "A Step Forward", email = "dev@a-step-forward.local" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.5,<2.0.0"
]

[project.scripts]
kickoff = "asf_qa_flow.main:kickoff"
run_crew = "asf_qa_flow.main:kickoff"
plot = "asf_qa_flow.main:plot"
run_with_trigger = "asf_qa_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
