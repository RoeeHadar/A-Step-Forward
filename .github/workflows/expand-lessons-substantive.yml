name: Expand Lessons (substantive)

# DEPRECATED 2026-07-02 — use Cursor Composer locally instead.
# See skills/expand-lessons-cursor/SKILL.md and scripts/cursor-expansion-queue.mjs.
# Groq free-tier TPM/TPD caused multi-hour stalls with zero commits.

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type DEPRECATED to confirm you read skills/expand-lessons-cursor/SKILL.md"
        required: true
        default: ""

concurrency:
  group: expand-lessons-substantive
  cancel-in-progress: false

jobs:
  deprecated-notice:
    name: Groq expansion deprecated — use Cursor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Redirect to Cursor workflow
        run: |
          echo "::warning::Groq bulk expansion is DEPRECATED."
          echo "Use Cursor Composer 2.5 + skills/expand-lessons-cursor/SKILL.md"
          echo "Queue: node scripts/cursor-expansion-queue.mjs --next 10"
          if [ "${{ inputs.acknowledge }}" != "DEPRECATED" ]; then
            echo "Re-run with acknowledge=DEPRECATED if you only wanted this notice."
            exit 1
          fi
          node scripts/cursor-expansion-queue.mjs --status
