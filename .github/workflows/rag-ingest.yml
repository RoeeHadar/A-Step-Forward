name: RAG Ingest

# Chunk + embed the authored bilingual corpus into kg_chunks on a target Neon DB
# (the same DB the web app reads) and verify retrieval. Manual dispatch only.
#
# Self-sufficient: applies the RAG schema (scripts/apply-rag-schema.mjs, the
# Neon-direct equivalent of Alembic 0024) before ingest, so it does NOT depend on
# the `Migrate Neon` workflow (whose Alembic chain is currently broken).
#
# Requires secrets:
#   - NVIDIA_API_KEY  (embeddings; nvidia/nv-embedqa-e5-v5)
#   - the DB secret for the chosen target:
#       production -> PRODUCTION_DATABASE_URL
#       staging    -> STAGING_DATABASE_URL
#       dev        -> DATABASE_URL

on:
  workflow_dispatch:
    inputs:
      db_target:
        description: "Neon DB target"
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev
      fresh:
        description: "TRUNCATE kg_chunks before ingest (clean slate)"
        type: boolean
        default: false
      recreate_schema:
        description: "DROP+recreate kg_chunks at vector(1024) (destructive; production needs confirm_production)"
        type: boolean
        default: false
      confirm_production:
        description: "Required to run fresh/recreate_schema against production"
        type: boolean
        default: false
      run_eval:
        description: "Run retrieval eval (recall@k) after ingest"
        type: boolean
        default: true

concurrency:
  group: rag-ingest-${{ inputs.db_target }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ inputs.db_target == 'production' && secrets.PRODUCTION_DATABASE_URL || inputs.db_target == 'staging' && secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_BASE_URL: ${{ vars.NVIDIA_BASE_URL || 'https://integrate.api.nvidia.com/v1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Target guard (refuse production + destructive without confirm)
        run: |
          node scripts/rag-ingest.mjs --guard-only --target "${{ inputs.db_target }}" ${{ inputs.recreate_schema && '--recreate-schema' || '' }} ${{ inputs.fresh && '--fresh' || '' }} ${{ inputs.confirm_production && '--confirm-production' || '' }}

      - name: Preflight (secrets present)
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DB secret for target '${{ inputs.db_target }}' not set"; exit 1; fi
          if [ -z "$NVIDIA_API_KEY" ]; then echo "::error::NVIDIA_API_KEY secret not set"; exit 1; fi

      - name: Apply RAG schema (kg_chunks @ vector(1024))
        run: |
          node scripts/apply-rag-schema.mjs --force --target "${{ inputs.db_target }}" ${{ inputs.recreate_schema && '--recreate' || '' }} ${{ inputs.confirm_production && '--confirm-production' || '' }}

      - name: Ingest corpus
        run: |
          node scripts/rag-ingest.mjs --force --target "${{ inputs.db_target }}" ${{ inputs.fresh && '--fresh' || '' }} ${{ inputs.confirm_production && '--confirm-production' || '' }}

      - name: Retrieval eval (recall@k)
        if: ${{ inputs.run_eval }}
        run: node scripts/rag-eval.mjs --min 0.75
