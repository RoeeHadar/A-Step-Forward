name: Cron — Weekly gate due notifications (manual backstop)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max accepted teacher-student pairs to scan"
        required: false
        default: "150"
        type: string
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: cron-weekly-gate-due
  cancel-in-progress: false

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger weekly-gate-due sweep
        env:
          BASE_URL: ${{ secrets.WEB_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ github.event.inputs.limit || '150' }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BASE_URL or CRON_SECRET secret missing; skipping (set in repo Secrets)."
            exit 0
          fi
          set -euo pipefail
          curl -sS -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -w '\nHTTP %{http_code}\n' \
            "$BASE_URL/api/cron/weekly-gate-due?limit=$LIMIT"
