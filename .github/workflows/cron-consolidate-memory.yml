name: Cron — Memory Steward consolidation (manual backstop)

# Manual backstop only — production schedule lives in apps/web/vercel.json.
# Run workflow_dispatch after verifying CRON_SECRET + WEB_BASE_URL secrets.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max learners to consolidate per invocation"
        required: false
        default: "25"
        type: string

jobs:
  call-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger consolidation sweep
        env:
          BASE_URL: ${{ secrets.WEB_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LIMIT: ${{ inputs.limit || '25' }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "BASE_URL or CRON_SECRET secret missing; skipping (set in repo Secrets)."
            exit 0
          fi
          set -euo pipefail
          curl -sS -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -w '\nHTTP %{http_code}\n' \
            "$BASE_URL/api/cron/consolidate-memory?limit=$LIMIT"
