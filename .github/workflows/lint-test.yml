name: Lint & Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: astepforward
          POSTGRES_USER: astepforward
          POSTGRES_PASSWORD: astepforward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astepforward"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://astepforward:astepforward@localhost:5432/astepforward
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: uv sync --all-groups

      - name: Ruff lint
        run: uv run ruff check infra tests scripts

      - name: Ruff format (check)
        run: uv run ruff format --check infra tests scripts

      - name: Mypy (infra)
        run: uv run mypy

      - name: Alembic upgrade head
        run: uv run alembic -c infra/alembic.ini upgrade head

      - name: API import smoke (matches Render Docker startup)
        run: |
          uv run --package asf-api python -c "
          from app.main import app
          from learner_model_service.api import get_learner_model_service
          from diagnostic_service.api import get_diagnostic_service
          from learning_path_service.api import get_learning_path_service
          assert app.title
          get_learner_model_service
          get_diagnostic_service
          get_learning_path_service
          "

      - name: Learning path unit tests
        run: uv run --package learning-path-service pytest -q

      - name: Pytest
        run: uv run pytest tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile || pnpm install

      - name: ESLint
        run: pnpm --filter @asf/web lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Schema TS tests
        run: pnpm --filter @asf/schemas test:ts

      - name: Vitest
        working-directory: apps/web
        run: pnpm exec vitest run --exclude 'src/lib/schemas.test.ts'

      - name: Question-store pipeline unit tests
        run: node --test scripts/lib/normalize-lesson.test.mjs scripts/lib/question-pipeline.test.mjs scripts/lib/katex-check.test.mjs

      - name: Validate lesson corpus (schema + depth)
        run: |
          node scripts/seed-lessons.mjs --dry-run
          node scripts/audit-lesson-depth.mjs --strict --phase=4

      - name: Strict validation (rewritten lessons)
        run: node scripts/audit-lesson-strict.mjs --pilot=scripts/seed_data/pilot-strict-allowlist.json --strict

      - name: Math notation lint (KaTeX renderability, no Hebrew-in-math)
        run: node scripts/audit-lesson-math.mjs --strict

      - name: Track-scope audit (no questions gated above every served track)
        run: node scripts/audit-track-scope.mjs

      - name: Curriculum track contract (5pt/uni denylists + required-basics)
        run: node scripts/audit-lesson-scope.mjs --strict

      - name: Facet checklist audit (piloted concept families)
        run: node scripts/audit-lesson-facets.mjs --strict

      - name: "Exam topic coverage (enforced tracks 3pt/4pt/5pt/physics/makhina/uni)"
        run: node scripts/audit-exam-topic-coverage.mjs --strict

      - name: Catalog shelving + empty learn targets
        run: |
          node scripts/audit-catalog-shelving.mjs --strict
          node scripts/audit-empty-learn-targets.mjs --strict

      - name: Rewrite-bar audit (per-lesson depth floors for rewritten lessons)
        run: node scripts/audit-lesson-rewrite-bar.mjs --allowlist=scripts/seed_data/rewrite-bar-allowlist.json --strict

      - name: Question re-derivation (Tier-1 verify blocks, whole corpus)
        run: node scripts/audit-question-verify.mjs --all --strict

      - name: Question verification (Tier-2 worked solutions, rewritten lessons)
        run: node scripts/audit-question-verify.mjs --allowlist=scripts/seed_data/rewrite-bar-allowlist.json --strict
