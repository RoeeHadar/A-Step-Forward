# University Math (Calculus 1, Linear Algebra) prerequisite graph
subject: math
level: university
concepts:
  - id: uni_functions_review
    name: Functions & Pre-Calculus Review
    name_he: פונקציות וחזרה על פרה-חשבון
    points_levels: [calc1]
    prerequisites: []
    skill_atoms:
      - "Function definition: domain, codomain, exactly-one output rule"
      - "Distinguish function vs relation (duplicate inputs / vertical-line test)"
      - "Injective test: f(a₁)=f(a₂) ⇒ a₁=a₂ (direct proof)"
      - "Non-injectivity counterexample: a₁≠a₂ with equal outputs"
      - "Surjective test: solve f(a)=b for arbitrary b in codomain"
      - "Bijection criterion: both injective and surjective"
      - "Range vs codomain: surjective iff range equals codomain"
      - "Inverse function exists iff bijective; construct f⁻¹"
      - "Horizontal line test for injectivity on ℝ→ℝ graphs"
      - "Composition rules: injectivity/surjectivity of g∘f"
    level_scope:
      calc1: "Set-theoretic functions in week 1 of Israeli calc-1; short proofs of injectivity/surjectivity and explicit inverse construction before limits."

  - id: uni_limits
    name: Limits & Continuity
    name_he: גבולות ורציפות
    points_levels: [calc1]
    prerequisites: [uni_functions_review]
    skill_atoms:
      - "Informal and ε–δ limit definition"
      - "One-sided limits and two-sided limit existence"
      - "Direct substitution when function is continuous at a"
      - "Factor and cancel for polynomial 0/0 limits"
      - "Conjugate rationalization for surd 0/0 limits"
      - "Standard limits: sin x/x, (eˣ−1)/x, ln(1+x)/x"
      - "L'Hôpital's rule for 0/0 and ∞/∞ (differentiate numerator and denominator separately)"
      - "Limit DNE: mismatched one-sided limits or oscillation"
      - "Continuity criterion: lim f(x)=f(a)"
      - "Limits at infinity and horizontal asymptotes"
    level_scope:
      calc1: "First calc-1 chapter; exam items reward fast technique selection (substitute → factor → conjugate → standard limits → L'Hôpital) and one-sided limit checks."

  - id: uni_derivatives
    name: Derivatives
    name_he: נגזרות
    points_levels: [calc1]
    prerequisites: [uni_limits]
    skill_atoms:
      - "Limit definition f'(a)=lim(f(a+h)−f(a))/h"
      - "Difference quotient as secant slope approaching tangent"
      - "Geometric meaning: derivative as tangent line slope"
      - "Tangent line equation y=f(a)+f'(a)(x−a)"
      - "Differentiability implies continuity (proof sketch)"
      - "Non-differentiability: corners, cusps, vertical tangents, discontinuities"
      - "Derivative as instantaneous rate of change"
      - "Sign of f' and increasing/decreasing intervals"
      - "Compute derivative from definition (polynomial, √x, sin x)"
      - "Estimate derivative from graph of f"
    level_scope:
      calc1: "Definition-first derivatives before rule shortcuts; calc-1 exams often require limit-definition computation for one standard function."

  - id: uni_derivative_applications
    name: Applications of Derivatives
    name_he: יישומי נגזרות
    points_levels: [calc1]
    prerequisites: [uni_derivatives]
    skill_atoms:
      - "Critical points: f'(x)=0 or f' undefined"
      - "First derivative test for local max/min (sign change of f')"
      - "Second derivative test for local extrema (f'' sign at critical point)"
      - "Concavity and inflection points (f'' sign change required)"
      - "Full function investigation: domain, critical points, asymptotes, sketch"
      - "Vertical, horizontal, and oblique asymptotes"
      - "Optimization: set up Q(x) from constraint, solve Q'(x)=0, check endpoints"
      - "Absolute extrema on closed interval [a,b]: compare critical values and endpoints"
      - "Tangent line and linear approximation at a point"
      - "Interpret f, f', f'' graphs and their relationships"
    level_scope:
      calc1: "Major calc-1 application block; full function investigation and constrained optimization word problems are staple midterm/final questions."

  - id: uni_integrals
    name: Integrals
    name_he: אינטגרלים
    points_levels: [calc1]
    prerequisites: [uni_derivatives]
    skill_atoms:
      - "Antiderivative: F'(x)=f(x)"
      - "Indefinite integral notation ∫f(x)dx=F(x)+C (mandatory +C)"
      - "Power rule integration ∫xⁿ dx (n≠−1)"
      - "∫(1/x)dx=ln|x|+C (exception to power rule)"
      - "Immediate integrals: sin, cos, eˣ, sec²x"
      - "Linearity of integration (term-by-term, constant factor)"
      - "FTC Part 2: ∫ₐᵇ f(x)dx=F(b)−F(a)"
      - "Verify antiderivative by differentiation"
      - "Initial value problem: recover f from f' and one point"
      - "Distinguish indefinite (function +C) vs definite (number) integrals"
    level_scope:
      calc1: "Antiderivatives and FTC bridge differentiation to area; omitting +C on indefinite integrals is a common exam deduction."

  - id: uni_integration_techniques
    name: Integration Techniques
    name_he: שיטות אינטגרציה
    points_levels: [calc1]
    prerequisites: [uni_integrals]
    skill_atoms:
      - "u-substitution: ∫f(g(x))g'(x)dx=∫f(u)du"
      - "Change u-limits on definite integrals under substitution"
      - "Integration by parts: ∫u dv=uv−∫v du"
      - "LIATE priority for choosing u in IBP"
      - "Repeated/tabular IBP for ∫xⁿeˣ dx and ∫eˣ sin x dx"
      - "Partial fractions for proper rational functions (distinct and repeated factors)"
      - "Polynomial long division before partial fractions when deg P ≥ deg Q"
      - "Trigonometric substitution for √(a²−x²), √(a²+x²), √(x²−a²)"
      - "Choose technique: u-sub vs IBP vs partial fractions vs trig sub"
      - "Combine methods when integrand has nested structure"
    level_scope:
      calc1: "Technique-selection chapter; graders award method marks for naming the correct approach before arithmetic."

  - id: uni_applications_integrals
    name: Applications of Integrals
    name_he: יישומי אינטגרלים
    points_levels: [calc1]
    prerequisites: [uni_integration_techniques]
    skill_atoms:
      - "Area between curves: ∫(top−bottom)dx on [a,b]"
      - "Find intersection points as integration limits; split when curves cross"
      - "Area with horizontal slices: integrate with respect to y"
      - "Disk method: V=π∫[f(x)]² dx (rotation about x-axis)"
      - "Washer method: V=π∫(R²−r²)dx (outer minus inner radius squared)"
      - "Shell method: V=2π∫x·h(x)dx (rotation about y-axis)"
      - "Choose disk/washer vs shell by axis of rotation vs integration variable"
      - "Rotation about shifted axis y=k or x=k (radius as distance to axis)"
      - "Set up integral from sketch with labeled intersections and radii"
      - "Net signed area vs total area between curves"
    level_scope:
      calc1: "Geometry-heavy calc-1 applications; sketch-first workflow with intersection finding and method naming before antiderivatives."

  - id: uni_sequences_series
    name: Sequences & Series
    name_he: סדרות וטורים
    points_levels: [calc1]
    prerequisites: [uni_limits, uni_integrals]
    skill_atoms:
      - "Divergence test: lim aₙ≠0 ⇒ series diverges (converse false)"
      - "p-series convergence: Σ1/nᵖ converges iff p>1"
      - "Integral test for positive decreasing terms"
      - "Direct comparison test (termwise inequality)"
      - "Limit comparison test with reference series"
      - "Ratio test for factorials and exponential powers"
      - "Root test for nth-power terms"
      - "Alternating series (Leibniz): bₙ decreasing and lim bₙ=0"
      - "Absolute vs conditional convergence classification"
      - "Convergence test decision strategy (which test to try first)"
    level_scope:
      calc1: "Late calc-1 / early calc-2 bridge; aliased lesson covers full convergence-test toolkit — Israeli university finals typically include 2–3 series classification problems."

  - id: uni_multivariable
    name: Multivariable Calculus
    name_he: חשבון רב-משתני
    points_levels: [calculus_2]
    prerequisites: [uni_derivatives, uni_integrals]
    skill_atoms:
      - "Functions z=f(x,y) and level curves f(x,y)=c"
      - "Multivariable limit along different paths (path dependence)"
      - "Continuity at a point in ℝ²"
      - "Partial derivatives ∂f/∂x and ∂f/∂y as single-variable limits"
      - "Mixed partials and Clairaut's theorem conditions"
      - "Gradient vector ∇f and direction of steepest ascent"
      - "Tangent plane to z=f(x,y) at (a,b)"
      - "Chain rule for multivariable compositions"
    level_scope:
      calculus_2: "Opening calc-2 multivariable chapter; limits, partials, gradient, and tangent-plane setup before integration in higher dimensions."

  - id: uni_partial_derivatives
    name: Partial Derivatives
    name_he: נגזרות חלקיות
    points_levels: [calculus_2]
    prerequisites: [uni_multivariable]
    skill_atoms:
      - "Compute ∂f/∂x and ∂f/∂y by treating other variables as constants"
      - "Second-order partials f_xx, f_xy, f_yx, f_yy"
      - "Clairaut: f_xy=f_yx when continuous"
      - "Directional derivative D_u f = ∇f·u"
      - "Gradient orthogonal to level curves"
      - "Local max/min via critical points where ∇f=0"
      - "Second derivative test in two variables (discriminant D)"
      - "Lagrange multipliers for constrained extrema"
    level_scope:
      calculus_2: "Partial derivatives through optimization; gradient, directional derivatives, and Lagrange multipliers are core calc-2 exam topics."

  - id: uni_multiple_integrals
    name: Multiple Integrals
    name_he: אינטגרלים מרובים
    points_levels: [calculus_2]
    prerequisites: [uni_partial_derivatives, uni_integration_techniques]
    skill_atoms:
      - "Double integral ∬_R f(x,y) dA as iterated integral"
      - "Type I and Type II regions in the plane"
      - "Change order of integration"
      - "Polar coordinates dA=r dr dθ"
      - "Area and volume via double integrals"
      - "Average value of f over region R"
      - "Triple integrals over boxes and simple solids"
      - "Jacobian intuition for coordinate changes"
    level_scope:
      calculus_2: "Double (and intro triple) integrals; region setup and polar/Jacobian changes dominate exam grading."

  - id: uni_vector_fields
    name: Vector Fields
    name_he: שדות וקטוריים
    points_levels: [calculus_2]
    prerequisites: [uni_multivariable]
    skill_atoms:
      - "Vector field F(x,y)=⟨P,Q⟩ visualization"
      - "Conservative field test: ∂P/∂y=∂Q/∂x on simply connected domain"
      - "Potential function φ with ∇φ=F"
      - "Divergence div F = ∂P/∂x+∂Q/∂y"
      - "Curl in 2D as scalar ∂Q/∂x−∂P/∂y"
      - "Flow interpretation of line integrals"
      - "Circulation and flux over closed curves"
    level_scope:
      calculus_2: "Vector fields, conservative tests, and div/curl vocabulary before line integrals and Green's theorem."

  - id: uni_line_integrals
    name: Line & Surface Integrals
    name_he: אינטגרלי קו ומשטח
    points_levels: [calculus_2]
    prerequisites: [uni_vector_fields, uni_multiple_integrals]
    skill_atoms:
      - "Line integral ∫_C f ds (scalar) vs ∫_C F·dr (vector)"
      - "Parameterize curves for line integrals"
      - "Work W=∫ F·dr interpretation"
      - "Fundamental theorem for line integrals when F=∇φ"
      - "Green's theorem ∮ P dx+Q dy = ∬(∂Q/∂x−∂P/∂y) dA"
      - "Orientation of closed curves (CCW positive)"
      - "Use Green's theorem to evaluate circulation or area"
    level_scope:
      calculus_2: "Line integrals and Green's theorem; parameterization discipline and orientation signs are common exam traps."

  - id: la_vectors
    name: Vectors in R^n
    name_he: וקטורים ב-R^n
    points_levels: [la]
    prerequisites: [uni_functions_review]
    skill_atoms:
      - "Vector in ℝⁿ as n-tuple; component-wise addition and scalar multiplication"
      - "Dot product u·v=Σuᵢvᵢ (result is a scalar)"
      - "Euclidean norm ||u||=√(u·u)"
      - "Unit vector û=u/||u||"
      - "Orthogonality test: u·v=0"
      - "Cauchy–Schwarz inequality |u·v|≤||u|| ||v||"
      - "Triangle inequality via Cauchy–Schwarz"
      - "Angle between vectors: cos θ=(u·v)/(||u|| ||v||)"
      - "Find vectors ⊥ to k given vectors via homogeneous dot-product system"
      - "Projection component comp_v u=(u·v)/||v||"
    level_scope:
      la: "Opening linear-algebra chapter; component arithmetic, dot product, and Cauchy–Schwarz proofs appear on every Israeli university LA final."

  - id: la_matrices
    name: Matrices & Linear Systems
    name_he: מטריצות ומערכות לינאריות
    points_levels: [la]
    prerequisites: [la_vectors]
    skill_atoms:
      - "Matrix addition and scalar multiplication (matching dimensions)"
      - "Matrix multiplication dimension check: m×k times k×n"
      - "Entry cᵢⱼ as row i · column j dot product"
      - "Non-commutativity AB≠BA (explicit counterexample)"
      - "Associativity (AB)C=A(BC)"
      - "Transpose laws including (AB)ᵀ=BᵀAᵀ"
      - "Identity matrix Iₙ and AI=IA=A"
      - "2×2 inverse formula via determinant ad−bc"
      - "Verify candidate inverse by checking AB=I"
      - "Inverse product law (AB)⁻¹=B⁻¹A⁻¹"
      - "Augmented matrix [A|b] for linear systems Ax=b"
      - "Elementary row operations (swap, scale, add multiple)"
      - "Row echelon form and RREF via Gaussian elimination"
      - "Classify unique, infinite, or inconsistent solutions from RREF"
      - "Free variables and parametric solution families"
    level_scope:
      la: "Matrix arithmetic plus Gaussian elimination on augmented systems; RREF classification and parametric solutions are tested alongside 2×2 inversion."

  - id: la_determinants
    name: Determinants
    name_he: דטרמיננטות
    points_levels: [la]
    prerequisites: [la_matrices]
    skill_atoms:
      - "2×2 determinant ad−bc and signed-area interpretation"
      - "Cofactor (Laplace) expansion along a row or column"
      - "3×3 determinant with (−1)ⁱ⁺ʲ sign checkerboard"
      - "Row-operation effects: swap flips sign, scale multiplies, add unchanged"
      - "Multiplicativity det(AB)=det(A)det(B)"
      - "Invertibility criterion det(A)≠0"
      - "Scaling law det(cA)=cⁿdet(A) for n×n"
      - "det(A⁻¹)=1/det(A) proof via AA⁻¹=I"
      - "Triangular matrix: det equals product of diagonal entries"
      - "Cramer's rule xᵢ=det(Aᵢ)/det(A) for small systems"
    level_scope:
      la: "Determinant properties and computation; cofactor expansion and row-operation shortcuts tested alongside invertibility and Cramer's rule on 2×2/3×3 systems."

  - id: la_vector_spaces
    name: Vector Spaces
    name_he: מרחבי וקטורים
    points_levels: [la]
    prerequisites: [la_matrices, la_vectors]
    skill_atoms:
      - "Vector space axioms (closure under + and scalar multiplication)"
      - "Subspace three-condition test: 0∈W, closed under +, closed under scalar mult"
      - "One-step subspace test: au+bv∈W for all u,v∈W"
      - "Homogeneous linear constraint defines subspace; affine (RHS≠0) fails at 0"
      - "span{v₁,…,vₖ} is always a subspace"
      - "Linear independence: Σcᵢvᵢ=0 ⇒ all cᵢ=0"
      - "Linear dependence via row reduction (rank < number of vectors)"
      - "Matrix with vectors as columns; independent iff rank=k"
      - "Intersection of subspaces is a subspace (template proof)"
      - "Union W₁∪W₂ generally not a subspace unless one contains the other"
    level_scope:
      la: "Abstract vector spaces and subspace proofs; row-reduction rank tests for independence are the standard computational hook on exams."

  - id: la_eigenvalues
    name: Eigenvalues & Eigenvectors
    name_he: ערכים ווקטורים עצמיים
    points_levels: [la]
    prerequisites: [la_determinants, la_vector_spaces]
    skill_atoms:
      - "Eigenvalue equation Av=λv"
      - "Characteristic polynomial det(A−λI)=0"
      - "Eigenvalues of diagonal/triangular matrix from diagonal entries"
      - "Eigenspace E_λ=ker(A−λI) via row reduction"
      - "Verify eigenvector: check Av=λv"
      - "trace(A)=sum of eigenvalues; det(A)=product of eigenvalues"
      - "Algebraic vs geometric multiplicity"
      - "Eigenvectors for distinct eigenvalues are linearly independent"
      - "Zero eigenvalue iff A is singular (det A=0)"
      - "Construct matrix with prescribed eigenvalues (diagonal example)"
    level_scope:
      la: "Characteristic polynomial and eigenspace computation; trace/det shortcuts and multiplicity language feed directly into diagonalization."

  - id: la_orthogonality
    name: Orthogonality & Least Squares
    name_he: ישרות וריבועים פחותים
    points_levels: [la]
    prerequisites: [la_vector_spaces, la_eigenvalues]
    skill_atoms:
      - "Standard inner product ⟨u,v⟩=uᵀv in ℝⁿ"
      - "Orthogonality ⟨u,v⟩=0 and norm ||v||=√⟨v,v⟩"
      - "Orthonormal set; QᵀQ=I when Q has ON columns"
      - "Orthogonal complement W⊥ and dim W+dim W⊥=n"
      - "Projection onto a line: proj_a b=(⟨b,a⟩/||a||²)a"
      - "Gram–Schmidt: subtract projections then normalize (never normalize first)"
      - "Projection onto subspace with ONB: Σ⟨b,qⱼ⟩qⱼ"
      - "QR decomposition A=QR via Gram–Schmidt"
      - "Least-squares solution as orthogonal projection onto Col(A)"
      - "Verify residual b−proj is orthogonal to subspace"
    level_scope:
      la: "Inner products through least squares; Gram–Schmidt, projection formulas, and QR are high-frequency computation and proof topics."

  - id: la_diagonalization
    name: Matrix Diagonalization
    name_he: אלכסון מטריצות
    points_levels: [la]
    prerequisites: [la_eigenvalues]
    skill_atoms:
      - "Diagonalizable criterion: geometric multiplicity equals algebraic multiplicity for every λ"
      - "Defective matrix when g.m.<a.m. (Jordan block intuition)"
      - "Find eigenvalues and linearly independent eigenvectors"
      - "Construct P (eigenvector columns) and D with A=PDP⁻¹"
      - "Compute Aⁿ efficiently via Dⁿ"
      - "Already-diagonal matrix is trivially diagonalizable"
      - "Rotation matrix may have no real eigenvalues (not diagonalizable over ℝ)"
      - "If A=PDP⁻¹ invertible then A⁻¹=PD⁻¹P⁻¹"
      - "Verify diagonalization: check AP=PD"
      - "Use diagonalization to evaluate matrix powers and recurrences"
    level_scope:
      la: "Diagonalization criterion and A=PDP⁻¹ construction; computing Aⁿ and deciding non-diagonalizability are standard final-exam capstone problems."
