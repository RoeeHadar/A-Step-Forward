      - "Length contraction: L = L₀/γ along motion direction"
      - "Rest energy E₀ = mc²"
      - "Relativistic kinetic energy KE = (γ − 1)mc²"
      - "Speed of light c as universal speed limit"
      - "Sanity check v ≪ c: classical limit recovers Newtonian formulas"
    level_scope:
      hs_physics: "Introductory special relativity at Bagrut depth — time dilation and length contraction formulas with v ≪ c checks; c as speed limit. Usually one calculation sub-part tied to modern-physics or nuclear context, not full Lorentz transformations."

