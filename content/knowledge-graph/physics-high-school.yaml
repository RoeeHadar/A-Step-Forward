# Physics – High School (Israeli Bagrut 5 units)
#
# Bagrut physics is split into 3 mandatory questionnaires + lab:
#   Mechanics   – שאלון 036-361 (30% of grade)
#   Electricity – שאלון 036-371 (30% of grade)
#   Radiation & Matter – קרינה וחומר (20% of grade)
#   Lab – מעבדה (20% of grade)
#
# Each concept carries:
#   points_levels  – [hs_physics]
#   bagrut_chapter – mechanics | electricity | radiation | lab
#   skill_atoms    – granular skills tested in Bagrut
#   level_scope    – Bagrut 5-unit exam depth and typical question types
#   prerequisites  – knowledge graph prerequisites

subject: physics
level: high_school
concepts:

  # ═══════════════════════════════════════════════════════════════════════
  # FOUNDATIONS
  # ═══════════════════════════════════════════════════════════════════════

  - id: units_measurement
    name: Units & Measurement
    name_he: יחידות ומדידות
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: []
    skill_atoms:
      - "SI base units: meter, kilogram, second, ampere, kelvin"
      - "Derived units: newton, joule, watt, pascal, coulomb"
      - "Unit conversion"
      - "Scientific notation and significant figures"
      - "Dimensional analysis"
      - "Measurement uncertainty and error analysis"
      - "Experimental setup and lab safety"
    level_scope:
      hs_physics: "Foundation for all Bagrut physics; tested in lab reports and embedded in every mechanics/electricity calculation. Expect unit conversion, significant figures, and dimensional analysis in multi-step exam questions."

  - id: vectors_basics
    name: Vectors — Basics
    name_he: וקטורים — יסודות
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [units_measurement]
    skill_atoms:
      - "Scalar vs. vector quantities"
      - "Vector representation: magnitude and direction"
      - "Vector addition: triangle method and parallelogram method"
      - "Vector subtraction"
      - "Resolving vectors into components (x and y)"
      - "Magnitude of resultant vector"
      - "Unit vectors"
    level_scope:
      hs_physics: "Prerequisite tool used throughout mechanics and electricity questionnaires. Typical items ask for component resolution, resultant magnitude/direction, and vector addition in 2D force or velocity problems."

  # ═══════════════════════════════════════════════════════════════════════
  # MECHANICS — KINEMATICS (Bagrut 036-361)
  # ═══════════════════════════════════════════════════════════════════════

  - id: kinematics_1d
    name: Kinematics in 1D
    name_he: קינמטיקה בממד אחד
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [units_measurement]
    skill_atoms:
      - "Distance vs. displacement"
      - "Speed vs. velocity"
      - "Uniform motion: x = x₀ + vt"
      - "Uniformly accelerated motion: kinematic equations"
      - "Free fall: a = g = 9.8 m/s²"
      - "x-t, v-t, a-t graphs — reading and interpretation"
      - "Relative velocity (1D)"
      - "Converting between graph forms"
      - "Average vs. instantaneous velocity"
    level_scope:
      hs_physics: "Core mechanics questionnaire (036-361) topic; almost every exam includes at least one kinematics item. Expect x-t/v-t graph reading, free-fall, and the four kinematic equations in multi-part word problems."

  - id: kinematics_2d
    name: Kinematics in 2D
    name_he: קינמטיקה בשני ממדים
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [kinematics_1d, vectors_basics]
    skill_atoms:
      - "Decompose v₀ into v₀x = v₀cosθ and v₀y = v₀sinθ"
      - "Independent x (constant v) and y (free fall) kinematics"
      - "Horizontal launch from height: time from vertical free fall"
      - "Maximum height H = v₀y²/(2g) at apex (v_y = 0)"
      - "Time of flight T = 2v₀y/g for symmetric ground launch"
      - "Range R = v₀²sin2θ/g from level ground"
      - "Landing speed v = √(v_x² + v_y²) from components"
      - "Relative velocity vector addition (e.g., boat in current)"
    level_scope:
      hs_physics: "Bagrut mechanics expects independent x/y motion analysis and relative-velocity setups (e.g., boats, aircraft). Questions combine vector components with 1D kinematic equations rather than calculus."

  - id: projectile_motion
    name: Projectile Motion
    name_he: זריקה
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [kinematics_2d, kinematics_1d]
    skill_atoms:
      - "Horizontal throw (zero initial vertical velocity)"
      - "Angled throw (general projectile)"
      - "Decomposing initial velocity into x and y components"
      - "Time of flight"
      - "Range (horizontal distance)"
      - "Maximum height"
      - "Velocity at any time (components and magnitude)"
      - "Launch from elevated position"
    level_scope:
      hs_physics: "A staple Bagrut mechanics question type — horizontal or angled launch with 3–4 sub-parts (range, max height, flight time, impact velocity). g = 10 m/s² is standard; answers must include units and clear decomposition."

  # ═══════════════════════════════════════════════════════════════════════
  # MECHANICS — DYNAMICS (Newton's Laws)
  # ═══════════════════════════════════════════════════════════════════════

  - id: newton_laws
    name: Newton's Laws of Motion
    name_he: חוקי ניוטון
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [kinematics_1d, vectors_basics]
    skill_atoms:
      - "Newton's 1st law: inertia and equilibrium"
      - "Newton's 2nd law: ΣF = ma"
      - "Newton's 3rd law: action-reaction pairs"
      - "Free body diagrams"
      - "Weight vs. mass: W = mg"
      - "Normal force"
      - "Tension in strings and cables"
      - "Atwood machine"
      - "Connected bodies (system of masses)"
      - "Inclined planes (with and without friction)"
    level_scope:
      hs_physics: "Central to the mechanics questionnaire; free-body diagrams and ΣF = ma appear in nearly every exam. Typical multi-part problems cover Atwood machines, inclines, tension, and connected masses with explicit FBD sketches."

  - id: friction
    name: Friction
    name_he: חיכוך
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [newton_laws]
    skill_atoms:
      - "Static friction: f ≤ μₛN"
      - "Kinetic friction: f = μₖN"
      - "Direction of friction force"
      - "Friction on inclined planes"
      - "Rolling vs. sliding friction"
      - "Problems combining friction and Newton's laws"
    level_scope:
      hs_physics: "Usually tested combined with Newton's laws on inclines or horizontal surfaces — not as an isolated topic. Expect μₛ vs μₖ distinction, friction direction, and whether motion starts or continues at constant speed."

  - id: circular_motion
    name: Circular Motion
    name_he: תנועה מעגלית"
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [kinematics_2d, newton_laws]
    skill_atoms:
      - "Period (T) and frequency (f)"
      - "Angular velocity: ω = 2π/T"
      - "Centripetal acceleration: a = v²/r = ω²r"
      - "Centripetal force: F = mv²/r"
      - "Circular motion on flat road (friction provides centripetal force)"
      - "Banked curves"
      - "Vertical circular motion (loop)"
      - "Conical pendulum"
      - "Satellite orbits"
    level_scope:
      hs_physics: "Bagrut mechanics includes centripetal force problems — flat curves, banked roads, vertical loops, and conical pendulums. Questions identify the force providing F_c and link ω, v, r, and T."

  - id: gravitation
    name: Gravitation
    name_he: כבידה
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [newton_laws, circular_motion]
    skill_atoms:
      - "Newton's law of gravitation: F = Gm₁m₂/r²"
      - "Gravitational constant G"
      - "Gravitational field strength g = GM/r²"
      - "Escape velocity"
      - "Satellite orbital velocity and period"
      - "Kepler's 3rd law: T² ∝ r³"
      - "Gravitational potential energy"
    level_scope:
      hs_physics: "Appears in mechanics as satellite/orbit and escape-velocity problems using F = Gm₁m₂/r² and Kepler's third law. Less frequent than circular motion on a string, but a full multi-part gravitation question is common in mock exams."

  # ═══════════════════════════════════════════════════════════════════════
  # MECHANICS — ENERGY & MOMENTUM
  # ═══════════════════════════════════════════════════════════════════════

  - id: work_energy
    name: Work & Energy
    name_he: עבודה ואנרגיה
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [newton_laws, kinematics_1d]
    skill_atoms:
      - "Work: W = F·d·cosθ"
      - "Positive, negative, and zero work"
      - "Kinetic energy: KE = ½mv²"
      - "Work-energy theorem: W_net = ΔKE"
      - "Gravitational potential energy: PE = mgh"
      - "Elastic potential energy: PE = ½kx²"
      - "Conservation of mechanical energy"
      - "Power: P = W/t = F·v"
      - "Efficiency"
    level_scope:
      hs_physics: "Regular mechanics questionnaire material — work by a force at an angle, KE/PE, and the work-energy theorem. Typical items compare methods (energy vs Newton) on inclines, springs, or lifting problems with efficiency sub-parts."

  - id: conservation_energy
    name: Conservation of Energy
    name_he: שימור אנרגיה
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [work_energy, friction]
    skill_atoms:
      - "Energy conservation in frictionless systems"
      - "Energy dissipation by friction: W_friction = -f·d"
      - "Energy conservation with friction"
      - "Roller coaster / pendulum type problems"
      - "Spring compression and energy storage"
      - "Energy transformation diagrams"
    level_scope:
      hs_physics: "Bagrut favorites include roller coasters, pendulums, and spring-block systems with and without friction. Expect E_initial = E_final (or accounting for W_friction) and qualitative energy bar/diagram interpretation."

  - id: momentum
    name: Momentum & Impulse
    name_he: תנע ומתקף
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [newton_laws, work_energy]
    skill_atoms:
      - "Linear momentum: p = mv"
      - "Impulse: J = F·Δt = Δp"
      - "Newton's 2nd law in terms of momentum"
      - "Conservation of momentum (no external forces)"
      - "Elastic collisions: both KE and p conserved"
      - "Inelastic collisions: only p conserved"
      - "Perfectly inelastic collisions (objects stick together)"
      - "2D momentum conservation (vector method)"
      - "Explosion problems (recoil)"
      - "Center of mass"
    level_scope:
      hs_physics: "Impulse and momentum conservation are tested in mechanics — often linked to collisions or explosions. Questions distinguish elastic vs inelastic outcomes and may require 2D vector momentum components."

  - id: collisions
    name: Collisions
    name_he: התנגשויות
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [momentum]
    skill_atoms:
      - "Elastic collision equations: head-on"
      - "Special case: equal masses"
      - "Coefficient of restitution"
      - "Ballistic pendulum"
      - "2D collision problems"
    level_scope:
      hs_physics: "Focused collision problems — head-on elastic/inelastic, coefficient of restitution, and ballistic-pendulum setups. Bagrut items usually give masses and initial speeds and ask for post-collision velocities or maximum swing height."

  - id: simple_harmonic_motion
    name: Simple Harmonic Motion (SHM)
    name_he: תנועה הרמונית פשוטה
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [newton_laws, work_energy]
    skill_atoms:
      - "Definition of SHM: F = -kx"
      - "Spring-mass system"
      - "Period: T = 2π√(m/k)"
      - "Simple pendulum: T = 2π√(L/g)"
      - "Amplitude, frequency, angular frequency"
      - "Position, velocity, acceleration as functions of time"
      - "Energy in SHM: KE + PE = constant"
      - "x(t) = A·cos(ωt+φ)"
    level_scope:
      hs_physics: "Spring-mass and simple-pendulum period formulas (T = 2π√(m/k), T = 2π√(L/g)) appear in mechanics; SHM also bridges to AC circuits. Questions ask for period, amplitude, or energy exchange at turning points — no differential equations required."

  # ═══════════════════════════════════════════════════════════════════════
  # MECHANICS — ROTATIONAL (included in Bagrut mechanics)
  # ═══════════════════════════════════════════════════════════════════════

  - id: torque
    name: Torque & Static Equilibrium
    name_he: מומנט ושיווי משקל סטטי
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [newton_laws, vectors_basics]
    skill_atoms:
      - "Torque: τ = r·F·sinθ"
      - "Conditions for static equilibrium: ΣF=0 and Στ=0"
      - "Center of gravity"
      - "Balancing a beam on a pivot"
      - "Ladder against wall problems"
      - "Uniform beam supported at two points"
    level_scope:
      hs_physics: "Static equilibrium with torques — ladder-on-wall and beam-on-pivot problems are classic Bagrut mechanics items. Both ΣF = 0 and Στ = 0 must be applied; center of gravity location is often a sub-part."

  - id: static_equilibrium
    name: Extended Static Equilibrium
    name_he: שיווי משקל מורחב
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [torque]
    skill_atoms:
      - "Translational equilibrium: ΣF_x = 0 and ΣF_y = 0"
      - "Rotational equilibrium: Στ = 0 about chosen pivot"
      - "Torque τ = r⊥F with consistent CCW/CW sign convention"
      - "Pivot at unknown force to eliminate reaction from Στ"
      - "Hinged beam + cable: solve tension from Στ about hinge"
      - "Two-support beam: reactions from torque balance + ΣF_y = 0"
      - "Non-uniform beam: weight acts at given CM, not geometric center"
      - "Ladder on frictionless wall: minimum μs from Στ at base"
      - "Stability: CM must lie above support base to resist tipping"
    level_scope:
      hs_physics: "Extended torque equilibrium beyond single-pivot cases — distributed loads, multi-support beams, and stability/tipping criteria. Less frequent than basic ladder problems but appears as a harder mechanics sub-question."

  - id: rotational_kinematics
    name: Rotational Kinematics
    name_he: קינמטיקה סיבובית
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [circular_motion]
    skill_atoms:
      - "Angular displacement (θ)"
      - "Angular velocity (ω)"
      - "Angular acceleration (α)"
      - "Rotational kinematic equations (analogous to linear)"
      - "Relationship between linear and angular: v=rω, a=rα"
    level_scope:
      hs_physics: "Rotational analogues of linear kinematics (θ, ω, α) with v = rω links — tested when combined with rotational dynamics or rolling. Bagrut depth is formula-based conversion, not calculus of rotation."

  - id: rotational_dynamics
    name: Rotational Dynamics & Angular Momentum
    name_he: דינמיקה סיבובית ותנע זוויתי
    points_levels: [hs_physics]
    bagrut_chapter: mechanics
    prerequisites: [rotational_kinematics, torque]
    skill_atoms:
      - "Moment of inertia I"
      - "Rotational Newton's 2nd law: τ = Iα"
      - "Rotational kinetic energy: ½Iω²"
      - "Angular momentum: L = Iω"
      - "Conservation of angular momentum"
      - "Rolling without slipping"
    level_scope:
      hs_physics: "Moment of inertia, τ = Iα, and angular-momentum conservation — including rolling-without-slipping on inclines. A full rotational-dynamics question is less guaranteed than linear mechanics but common in 5-unit mocks."

  # ═══════════════════════════════════════════════════════════════════════
  # WAVES & OPTICS (Radiation & Matter chapter)
  # ═══════════════════════════════════════════════════════════════════════

  - id: waves_basics
    name: Mechanical Waves
    name_he: גלים מכניים
    points_levels: [hs_physics]
    bagrut_chapter: radiation
    prerequisites: [simple_harmonic_motion]
    skill_atoms:
      - "Transverse vs. longitudinal waves"
      - "Wave speed: v = fλ"
      - "Wavelength, frequency, period relationships"
      - "Amplitude and wave energy"
      - "Reflection and refraction of waves"
      - "Superposition and interference"
      - "Standing waves"
    level_scope:
      hs_physics: "Core radiation-questionnaire (קרינה וחומר) material — v = fλ, standing waves on strings, and interference basics. Questions often combine SHM with wave speed and harmonic frequencies on a stretched string."

  - id: sound_waves
    name: Sound Waves
    name_he: גלי קול
    points_levels: [hs_physics]
    bagrut_chapter: radiation
    prerequisites: [waves_basics]
    skill_atoms:
      - "Nature of sound: longitudinal pressure wave"
      - "Speed of sound in different media"
      - "Decibels and sound intensity"
      - "Beats"
      - "Resonance"
    level_scope:
      hs_physics: "Sound as a longitudinal wave — speed in media, intensity/decibels at conceptual level, beats, and resonance in pipes/strings. Typical radiation-chapter items ask for frequency relationships or explain standing-wave patterns in air columns."

  - id: doppler
    name: Doppler Effect
    name_he: אפקט דופלר
    points_levels: [hs_physics]
    bagrut_chapter: radiation
    prerequisites: [sound_waves]
    skill_atoms:
      - "General Doppler: f_obs = f₀(v ± v_obs)/(v ∓ v_src)"
      - "Sign rule: approaching raises observed frequency"
      - "Moving source only: f_obs = f₀·v/(v ∓ v_src)"
      - "Moving observer only: f_obs = f₀·(v ± v_obs)/v"
      - "Both moving: apply numerator and denominator signs together"
      - "Two-frequency method: solve v_src from approach/recession ratio"
      - "Qualitative: approaching source shortens observed wavelength"
      - "Light Doppler approximation: f_obs ≈ f₀(1 ± v/c)"
    level_scope:
      hs_physics: "Doppler frequency shift for moving source or observer — a standard radiation-topic calculation. Bagrut questions give speeds and rest frequency and ask for observed frequency or qualitative shift direction (approaching vs receding)."

  - id: optics_geometric
    name: Geometric Optics
    name_he: אופטיקה גיאומטרית
    points_levels: [hs_physics]
    bagrut_chapter: radiation
    prerequisites: [waves_basics]
    skill_atoms:
      - "Law of reflection: θᵢ = θᵣ"
      - "Plane mirror: image location and properties"
      - "Concave and convex mirrors: focal length"
      - "Mirror equation: 1/f = 1/do + 1/di"
      - "Magnification"
      - "Refraction: Snell's law n₁sinθ₁ = n₂sinθ₂"
      - "Total internal reflection"
      - "Critical angle"
      - "Converging and diverging lenses"
      - "Lens equation: 1/f = 1/do + 1/di"
      - "Real vs. virtual images"
      - "Human eye: near-sightedness, far-sightedness"
    level_scope:
      hs_physics: "Major radiation-questionnaire topic — mirror/lens equations (1/f = 1/do + 1/di), Snell's law, total internal reflection, and ray diagrams. Multi-part items locate images, compute magnification, and classify real vs virtual."

  - id: optics_physical
    name: Wave Optics
    name_he: אופטיקה גלית
    points_levels: [hs_physics]
    bagrut_chapter: radiation
    prerequisites: [optics_geometric, waves_basics]
    skill_atoms:
      - "Double-slit fringe spacing Δy = λL/d"
      - "Bright fringe position y_m = mλL/d"
      - "Path-difference condition for constructive/destructive interference"
      - "Thin film: optical path 2nt with reflection phase shifts"
      - "λ/2 phase shift at reflection from higher-n medium"
      - "Single-slit first minimum: a sin θ = λ"
      - "Polarization: filtering light by oscillation direction"
      - "Qualitative diffraction: spreading through narrow aperture"
    level_scope:
      hs_physics: "Wave optics in the radiation chapter — Young's double-slit, path-difference interference conditions, and basic diffraction/polarization concepts. Calculations use Δx = mλ/2 or similar; no full electromagnetic-wave derivations."

  # ═══════════════════════════════════════════════════════════════════════
  # ELECTRICITY & MAGNETISM (Bagrut 036-371)
  # ═══════════════════════════════════════════════════════════════════════

  - id: electrostatics
    name: Electrostatics
    name_he: אלקטרוסטטיקה
    points_levels: [hs_physics]
    bagrut_chapter: electricity
    prerequisites: [vectors_basics, units_measurement]
    skill_atoms:
      - "Electric charge: positive and negative"
      - "Conservation of charge"
      - "Coulomb's law: F = kq₁q₂/r²"
      - "Electric field: E = F/q"
      - "Electric field lines"
      - "Electric field of a point charge: E = kq/r²"
      - "Superposition of electric fields"
    level_scope:
      hs_physics: "Opening topic of the electricity questionnaire (036-371) — Coulomb's law, field of point charges, and superposition. Typical items compute force or field magnitude/direction and sketch field lines for simple charge configurations."

  - id: electric_field
    name: Electric Field & Potential
    name_he: שדה חשמלי ופוטנציאל
    points_levels: [hs_physics]
    bagrut_chapter: electricity
    prerequisites: [electrostatics]
    skill_atoms:
      - "Electric potential energy: U = kq₁q₂/r"
      - "Electric potential: V = kq/r"
      - "Relationship: E = -ΔV/Δx"
      - "Work by electric field: W = qΔV"
      - "Equipotential surfaces"
      - "Motion of charged particle in electric field"
      - "Uniform electric field between plates: E = V/d"
    level_scope:
      hs_physics: "Electric potential, ΔV, and motion of charges in uniform fields (E = V/d) — central to electricity exams. Questions link work W = qΔV to kinetic energy gained and trajectories between parallel plates."

  - id: electric_potential
    name: Capacitors
    name_he: קבלים
    points_levels: [hs_physics]
    bagrut_chapter: electricity
    prerequisites: [electric_field]
    skill_atoms:
      - "Point charge potential V = kQ/r"
      - "Work to move charge: W = qΔV"
      - "Field-potential relation E = −dV/dr"
      - "Superposition: total V = Σ kQᵢ/rᵢ"
      - "Finding point where net V = 0 between two charges"
      - "Energy to assemble a charge configuration"
      - "Equipotential surfaces perpendicular to E field"
      - "Potential difference ΔV between two field points"
    level_scope:
      hs_physics: "Capacitor C = Q/V, parallel-plate formula, stored energy, and series/parallel combinations — tested within electricity multi-part problems. Expect equivalent capacitance and energy before/after reconfiguration."

  - id: electric_circuits
    name: Electric Circuits
    name_he: מעגלי חשמל (DC)
    points_levels: [hs_physics]
    bagrut_chapter: electricity
    prerequisites: [electric_potential]
    skill_atoms:
      - "Electric current: I = Q/t"
      - "Ohm's law: V = IR"
      - "Resistors in series: R_total = ΣRᵢ"
      - "Resistors in parallel: 1/R_total = Σ(1/Rᵢ)"
      - "EMF and internal resistance"
      - "Power: P = IV = I²R = V²/R"
      - "Energy: E = Pt"
      - "Ammeter and voltmeter placement"
    level_scope:
      hs_physics: "DC circuit fundamentals — Ohm's law, series/parallel resistors, EMF with internal resistance, and P = IV. Almost every electricity exam includes a circuit calculation with ammeter/voltmeter placement and power/energy sub-parts."

  - id: kirchhoff_laws
    name: Kirchhoff's Laws
    name_he: חוקי קירכהוף
    points_levels: [hs_physics]
    bagrut_chapter: electricity
    prerequisites: [electric_circuits]
    skill_atoms:
      - "KCL junction rule: sum currents in = sum currents out"
      - "KVL loop rule: sum voltage rises and drops = 0"
      - "Assigning branch current directions before writing equations"
      - "Battery − to +: voltage rise; resistor in I direction: drop"
      - "Single-loop KVL with resistors and EMF sources"
      - "Two-loop circuit: (n−1) KCL + mesh KVL equations"
      - "Node analysis: express branch currents at junctions"
      - "Wheatstone bridge balance condition"
    level_scope:
      hs_physics: "KCL and KVL for multi-loop and multi-node DC circuits — a hallmark electricity-questionnaire problem type. Students set up junction and loop equations; bridge/Wheatstone configurations appear as harder variants."

  - id: magnetism
    name: Magnetism & Magnetic Forces
    name_he: מגנטיות וכוחות מגנטיים
    points_levels: [hs_physics]
    bagrut_chapter: electricity
    prerequisites: [electric_circuits, vectors_basics]
    skill_atoms:
      - "Magnetic field: B (Tesla)"
      - "Magnetic field of a long wire: B = μ₀I/(2πr)"
      - "Force on a current-carrying wire: F = BIL·sinθ"
      - "Force on moving charge: F = qv×B (Lorentz force)"
